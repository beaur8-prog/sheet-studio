name: Worksheet editing regression
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Regression scope
        type: choice
        options: [all, excel-parity, full, print-layout, file-dialogs, file-associations]
        default: all
permissions:
  contents: read
jobs:
  editing:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux virtual display and Korean fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-noto-cjk
      - run: npm ci
      - run: npm run runtime:install
      - run: npm test
      - run: npm run build
      - name: Check native composition and existing editing behavior
        shell: bash
        run: |
          specs="user-journeys autofill ime-entry chart-audit bar-style chart-legend chart-selection entry-navigation cell-editing formulas functions dimensions worksheet filters filter-colors pivot pivot-arrays sheet-lifecycle colors cell-format studio-clipboard parity-audit file-dialogs file-associations recovery capacity"
          core_specs="chart-parity recalculation data-region xlsx-preservation external-links cell-constraints named-ranges excel-tables table-editing table-structure bulk-structure drawing-sheets whole-references stored-arrays dynamic-arrays array-views result-types number-formats style-defaults worksheet-extras sheet-print print-layout print-settings virtual-scroll clipboard-types let anchor-position chart-axis cell-navigation format-reset bulk-text large-spills"
          if [ "${{ inputs.scope }}" = full ]; then
            specs="$specs $core_specs"
          elif [ "${{ inputs.scope }}" = excel-parity ]; then
            specs="$core_specs"
          elif [ "${{ inputs.scope }}" = print-layout ]; then
            specs="sheet-print print-layout print-settings worksheet-extras"
          elif [ "${{ inputs.scope }}" != all ]; then
            specs="file-dialogs file-associations recovery user-journeys"
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a node scripts/electron-smoke.cjs
            else
              node scripts/electron-smoke.cjs
            fi
          fi
          for spec in $specs; do
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a node "tests/ui-$spec.mjs" --desktop
            else
              node "tests/ui-$spec.mjs" --desktop
            fi
          done
          if [ "${{ inputs.scope }}" = excel-parity ]; then
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a node tests/ui-capacity.mjs --desktop --structure
              xvfb-run -a node tests/ui-capacity.mjs --desktop --tall --structure
            else
              node tests/ui-capacity.mjs --desktop --structure
              node tests/ui-capacity.mjs --desktop --tall --structure
            fi
          elif [ "${{ inputs.scope }}" = all ] || [ "${{ inputs.scope }}" = full ]; then
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a node tests/ui-capacity.mjs --desktop --tall
            else
              node tests/ui-capacity.mjs --desktop --tall
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editing-validation-${{ matrix.os }}
          path: |
            test-results/*.png
            test-results/*.pdf
            test-results/capacity-*.json
            test-results/large-spills*.json
            test-results/array-views.json
            test-results/pivot-arrays.json
            test-results/file-dialogs.json
            test-results/file-associations.json
            test-results/user-journeys.json
          if-no-files-found: ignore
