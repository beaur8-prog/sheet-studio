name: Worksheet editing regression
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Regression scope
        type: choice
        options: [all, file-dialogs]
        default: all
permissions:
  contents: read
jobs:
  editing:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux virtual display and Korean fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-noto-cjk
      - run: npm ci
      - run: npm run runtime:install
      - run: npm test
      - run: npm run build
      - name: Check native composition and existing editing behavior
        shell: bash
        run: |
          specs="user-journeys autofill ime-entry chart-audit bar-style chart-legend chart-selection entry-navigation cell-editing formulas functions dimensions worksheet filters filter-colors pivot sheet-lifecycle colors cell-format studio-clipboard parity-audit file-dialogs recovery capacity"
          if [ "${{ inputs.scope }}" = file-dialogs ]; then
            specs="file-dialogs recovery"
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a node scripts/electron-smoke.cjs
            else
              node scripts/electron-smoke.cjs
            fi
          fi
          for spec in $specs; do
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a node "tests/ui-$spec.mjs" --desktop
            else
              node "tests/ui-$spec.mjs" --desktop
            fi
          done
          if [ "${{ inputs.scope }}" != file-dialogs ]; then
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a node tests/ui-capacity.mjs --desktop --tall
            else
              node tests/ui-capacity.mjs --desktop --tall
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editing-validation-${{ matrix.os }}
          path: |
            test-results/*.png
            test-results/capacity-*.json
            test-results/file-dialogs.json
            test-results/user-journeys.json
          if-no-files-found: ignore
