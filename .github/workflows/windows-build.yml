name: Windows installer build and updater validation
on:
  workflow_dispatch:
    inputs:
      updater_only:
        description: Rebuild and focus on updater handoff checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run runtime:install
      - run: npm test
        if: inputs.updater_only != true
      - run: npm run test:updates
      - name: Check Windows PowerShell helper syntax
        shell: powershell
        run: |
          $tokens = $null
          $issues = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'electron/studio-update-windows.ps1'), [ref]$tokens, [ref]$issues) | Out-Null
          if ($issues.Count) { $issues | Format-List; throw 'Update helper syntax check failed' }
      - run: npm run package:win
      - name: Check packaged editor, update UI and document recovery
        if: inputs.updater_only != true
        shell: bash
        run: |
          node scripts/electron-smoke.cjs --packaged
          node tests/ui-updates.mjs --packaged
          node tests/ui-recovery.mjs --packaged
          node tests/ui-file-dialogs.mjs --packaged
          node tests/ui-user-journeys.mjs --packaged
      - name: Verify install, reinstall, file associations and uninstall
        if: inputs.updater_only != true
        shell: pwsh
        run: ./scripts/check-windows-install.ps1
      - name: Verify native helper handoff, cancellation, failure and tampering
        run: node scripts/test-windows-updater-handoff.cjs
      - name: Verify actual Sheet close guards and recovery during native updates
        run: node tests/ui-windows-update-close.mjs
      - name: Build the pinned pre-fix installer for actual upgrade reproduction
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'sheet-update-baseline'
          git worktree add --detach $baseline 0aba3913ff5f7148351ee2963d49e57159906d1a
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare baseline source.' }
          Push-Location $baseline
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'Baseline dependencies failed.' }
            npm run runtime:install
            if ($LASTEXITCODE -ne 0) { throw 'Baseline runtime failed.' }
            npm run package:win
            if ($LASTEXITCODE -ne 0) { throw 'Baseline package failed.' }
          } finally { Pop-Location }
      - name: Verify real NSIS updates preserve scope, custom directory and single relaunch
        shell: pwsh
        run: ./scripts/test-windows-update-in-place.ps1
      - name: Prepare versioned installer and checksum
        shell: bash
        env:
          TARGET_PLATFORM: win
          TARGET_ARCH: x64
        run: node scripts/release-assets.cjs
      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: sheet-studio-windows-installer
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheet-studio-windows-validation
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 30
