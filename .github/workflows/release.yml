name: Release packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (e.g. v0.7.4)
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      SHEET_STUDIO_ADHOC: '1'
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate version and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node -e "if(process.env.RELEASE_TAG!=='v'+require('./package.json').version)throw Error('Tag/version mismatch')"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - run: npm ci
      - run: npm run runtime:install
      - run: npm test
      - run: npm run package -- --${{ matrix.platform }} --arch=${{ matrix.arch }}
      - run: node scripts/electron-smoke.cjs --packaged
      - run: node tests/ui-sheet-lifecycle.mjs --packaged
      - run: node tests/ui-colors.mjs --packaged
      - name: Verify Windows installation and shortcut
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/check-windows-install.ps1
      - name: Prepare download assets
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/release-assets.cjs
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-checks-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-results/
            release-assets/
          if-no-files-found: ignore
