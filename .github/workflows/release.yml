name: Release packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (e.g. v0.7.4)
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      SHEET_STUDIO_ADHOC: '1'
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate version and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node -e "if(process.env.RELEASE_TAG!=='v'+require('./package.json').version)throw Error('Tag/version mismatch')"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - name: Install Linux test dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-noto-cjk x11-utils desktop-file-utils python3-gi gir1.2-gtk-3.0 hicolor-icon-theme libgtk-3-0 libnss3 libasound2 libgbm1
      - run: npm ci
      - run: npm run runtime:install
      - run: npm test
      - run: npm run test:updates
      - run: npm run package -- --${{ matrix.platform }} --arch=${{ matrix.arch }}
      - name: Install Linux DEB
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get install -y ./release/*/linux-x64/*.deb
          test -x '/opt/Sheet Studio/sheet-studio'
          test -f /usr/share/applications/sheet-studio.desktop
          echo 'SHEET_STUDIO_EXECUTABLE=/opt/Sheet Studio/sheet-studio' >> "$GITHUB_ENV"
      - name: Test packaged application
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = linux ]; then
            xvfb-run -a node scripts/check-linux-desktop.cjs
            xvfb-run -a node scripts/electron-smoke.cjs --packaged
            xvfb-run -a node tests/ui-user-journeys.mjs --packaged
            xvfb-run -a node tests/ui-file-dialogs.mjs --packaged
            xvfb-run -a node tests/ui-file-associations.mjs --packaged
            xvfb-run -a node tests/ui-recovery.mjs --packaged
            xvfb-run -a node tests/ui-capacity.mjs --packaged
            xvfb-run -a node tests/ui-capacity.mjs --packaged --tall
            xvfb-run -a node tests/ui-chart-audit.mjs --packaged
            xvfb-run -a node tests/ui-bar-style.mjs --packaged
            xvfb-run -a node tests/ui-filter-colors.mjs --packaged
            xvfb-run -a node tests/ui-chart-selection.mjs --packaged
            xvfb-run -a node tests/ui-chart-legend.mjs --packaged
            xvfb-run -a node tests/ui-ime-entry.mjs --packaged
            xvfb-run -a node tests/ui-autofill.mjs --packaged
            xvfb-run -a node tests/ui-border-width.mjs --packaged
            xvfb-run -a node tests/ui-entry-navigation.mjs --packaged
            xvfb-run -a node tests/ui-cell-editing.mjs --packaged
            xvfb-run -a node tests/ui-formulas.mjs --packaged
            xvfb-run -a node tests/ui-sheet-lifecycle.mjs --packaged
            xvfb-run -a node tests/ui-colors.mjs --packaged
            xvfb-run -a node tests/ui-cell-format.mjs --packaged
            xvfb-run -a node tests/ui-studio-clipboard.mjs --packaged
            xvfb-run -a node tests/ui-parity-audit.mjs --packaged
          else
            node scripts/electron-smoke.cjs --packaged
            node tests/ui-user-journeys.mjs --packaged
            node tests/ui-file-dialogs.mjs --packaged
            node tests/ui-file-associations.mjs --packaged
            node tests/ui-recovery.mjs --packaged
            node tests/ui-capacity.mjs --packaged
            node tests/ui-capacity.mjs --packaged --tall
            node tests/ui-chart-audit.mjs --packaged
            node tests/ui-bar-style.mjs --packaged
            node tests/ui-filter-colors.mjs --packaged
            node tests/ui-chart-selection.mjs --packaged
            node tests/ui-chart-legend.mjs --packaged
            node tests/ui-ime-entry.mjs --packaged
            node tests/ui-autofill.mjs --packaged
            node tests/ui-border-width.mjs --packaged
            node tests/ui-entry-navigation.mjs --packaged
            node tests/ui-cell-editing.mjs --packaged
            node tests/ui-formulas.mjs --packaged
            node tests/ui-sheet-lifecycle.mjs --packaged
            node tests/ui-colors.mjs --packaged
            node tests/ui-cell-format.mjs --packaged
            node tests/ui-studio-clipboard.mjs --packaged
            node tests/ui-parity-audit.mjs --packaged
          fi
      - name: Verify Windows installation and shortcut
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/check-windows-install.ps1
      - name: Prepare download assets
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/release-assets.cjs
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-checks-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-results/
            release-assets/
          if-no-files-found: ignore
